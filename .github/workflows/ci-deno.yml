name: Deno CI

on:
  push:
  pull_request:

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Check formatting
        run: deno fmt --check deno/

      - name: Lint
        run: deno lint deno/

      - name: Test
        run: deno test --no-prompt deno/
