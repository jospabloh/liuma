<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) is always 0, so
         every inset below (BottomNav, ThemeSwitcher, Lumi) was a no-op and an
         iPhone in landscape letterboxed the app. With it, the page reaches the
         screen edges and each fixed control pads itself by the inset; normal
         content is kept out of the notch by body's side padding (index.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="LIUMA · Gestión escolar: asistencia, tareas, avisos, calendario y pagos de tu escuela en un solo lugar." />
    <!-- Marca propia de LIUMA (public/). Antes apuntaba al logo de Base44 y a un
         /manifest.json que no existía, así que "Agregar a pantalla de inicio"
         creaba un acceso genérico sin nombre ni icono. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LIUMA" />
    <meta name="application-name" content="LIUMA" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LIUMA · Gestión escolar</title>
    <script>
      // Pre-mount theme resolution — applies .dark before React hydrates so
      // there's no flash of the wrong theme. Mirrors src/lib/ThemeContext.jsx
      // exactly: same key, same 'light' | 'dark' | 'system' values, 'system'
      // (and anything unreadable) resolving against the device. Keep both in
      // sync by hand.
      (function () {
        try {
          var pref = window.localStorage.getItem('liuma-theme');
          if (pref !== 'light' && pref !== 'dark') pref = 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
